<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="복습">
  <title>복습 플래너</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">오늘</h1>
    <span id="today-label"></span>
    <i id="sync-dot" class="off" title="동기화 꺼짐"></i>
  </header>

  <main>
    <!-- 오늘 -->
    <section id="view-today" class="view">
      <div id="subject-chips" class="chips"></div>
      <form id="quick-form">
        <textarea id="quick-input" rows="1" placeholder="공부한 것 #과목  (여러 줄·3~7장 가능)"></textarea>
        <button type="submit">추가</button>
      </form>
      <div id="date-row" class="date-row">
        <span class="hint">공부한 날</span>
        <button type="button" class="chip" data-back="0">오늘</button>
        <button type="button" class="chip" data-back="1">어제</button>
        <span class="chip pick" id="date-pick">날짜 선택<input type="date" id="quick-date" aria-label="공부한 날 선택"></span>
      </div>
      <div id="stats" class="stats"></div>
      <div id="today-filter" class="chips filter hidden"></div>
      <ul id="today-list" class="list"></ul>
      <div id="overflow-box" class="overflow hidden">
        <p id="overflow-text"></p>
        <button id="spread-btn">다음 날들로 나누기</button>
      </div>
      <p id="empty-today" class="empty hidden">오늘 복습할 항목이 없습니다.</p>
      <div id="week" class="week-box"></div>
      <details id="done-box" class="done-box hidden">
        <summary>오늘 끝낸 복습 <b id="done-count">0</b>개 <span class="hint">· 평가 바꾸기·취소</span></summary>
        <ul id="done-list" class="list"></ul>
      </details>
    </section>

    <!-- 달력 -->
    <section id="view-calendar" class="view hidden">
      <div class="cal-head">
        <button id="cal-prev" aria-label="이전 달">‹</button>
        <strong id="cal-title"></strong>
        <button id="cal-next" aria-label="다음 달">›</button>
      </div>
      <p id="cal-stats" class="cal-stats"></p>
      <div id="cal-grid" class="cal-grid"></div>
      <p class="hint"><b class="lg-due">파란 숫자</b> 앞으로 잡힌 복습 (계속 ‘기억남’이라고 가정한 예상치) · <b class="lg-done">초록 숫자</b> 그날 끝낸 복습</p>
      <ul id="cal-day-list" class="list"></ul>
    </section>

    <!-- 과목 -->
    <section id="view-subjects" class="view hidden">
      <div class="subj-search">
        <input id="subj-search" type="search" placeholder="항목 찾기 (제목·메모)" autocomplete="off">
        <div class="checks">
          <label class="check"><input type="checkbox" id="only-weak"> 자주 잊는 항목만 <span id="weak-count"></span></label>
          <label class="check"><input type="checkbox" id="show-done"> 완료한 항목도 보기</label>
        </div>
      </div>
      <div id="subject-list"></div>
    </section>

    <!-- 설정 -->
    <section id="view-settings" class="view hidden">
      <label>복습 간격 (일, 쉼표로 구분)
        <input id="set-intervals" inputmode="numeric">
      </label>
      <label>하루 시작 시각 (이 시각 전은 전날로 침)
        <input id="set-daystart" type="number" min="0" max="12">
      </label>
      <label>하루 복습 상한
        <input id="set-limit" type="number" min="1" max="500">
      </label>
      <label>시험일 (이후 복습은 전날로 당김)
        <input id="set-exam" type="date">
      </label>
      <label>아침 알림 (오늘 복습 수, 비우면 끔)
        <input id="set-morning" type="time">
      </label>
      <label>밤 알림 (아직 남은 복습이 있을 때, 비우면 끔)
        <input id="set-evening" type="time">
      </label>
      <button id="save-settings">설정 저장</button>
      <div id="push-box"></div>

      <h3>동기화</h3>
      <div id="sync-box"></div>

      <h3>백업</h3>
      <p class="hint">로그인하지 않으면 데이터는 이 기기에만 저장됩니다. 주기적으로 내보내기 해두세요.</p>
      <div class="row">
        <button id="export-btn">내보내기 (JSON)</button>
        <label class="file-btn">가져오기<input id="import-file" type="file" accept="application/json" hidden></label>
      </div>

      <h3>개발용</h3>
      <label>날짜 이동 (일) — 테스트용 시간여행
        <input id="set-offset" type="number">
      </label>
      <button id="reset-btn" class="danger">전체 초기화</button>
    </section>
  </main>

  <!-- 항목 고치기 -->
  <dialog id="edit-dlg">
    <form id="edit-form">
      <h3>항목 고치기</h3>
      <label>제목<input id="ed-title" maxlength="200" required></label>
      <label>과목<select id="ed-subject"></select></label>
      <label>공부한 날<input type="date" id="ed-date" required></label>
      <label>메모<textarea id="ed-note" rows="2" maxlength="1000" placeholder="쪽수, 헷갈린 부분 등"></textarea></label>
      <p id="ed-info" class="hint"></p>
      <div id="ed-rate" class="ed-rate"></div>
      <div class="dlg-row">
        <button type="button" id="ed-postpone">내일로 미루기</button>
        <button type="button" id="ed-delete" class="danger">삭제</button>
      </div>
      <div class="dlg-row">
        <button type="button" id="ed-cancel">취소</button>
        <button type="submit" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <nav>
    <button data-view="today" class="active">오늘</button>
    <button data-view="calendar">달력</button>
    <button data-view="subjects">과목</button>
    <button data-view="settings">설정</button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
